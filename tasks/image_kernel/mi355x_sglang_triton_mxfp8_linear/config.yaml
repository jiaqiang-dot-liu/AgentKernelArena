  - case_id: qkv_proj-decode-m64
    semantic_io_bytes: 8679424
    arithmetic_ops: 1006632960
    ideal_latency_ms: 0.002164928
    bound: mixed-bound
  - case_id: qkv_proj-prefill-m16384
    semantic_io_bytes: 153862144
    arithmetic_ops: 257698037760
    ideal_latency_ms: 0.052279642
    bound: compute-bound
  - case_id: o_proj-decode-m1
    semantic_io_bytes: 6501408
    arithmetic_ops: 12582912
    ideal_latency_ms: 0.001892676
    bound: latency-bound
  - case_id: o_proj-decode-m64
    semantic_io_bytes: 7342080
