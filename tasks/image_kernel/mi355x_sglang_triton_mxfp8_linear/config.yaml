    hbm_bandwidth_tb_per_s: 8.0
    mxfp8_matrix_peak_pflops: 5.0332
    mxfp8_matrix_peak_source: AMD Instinct MI355X GPU brochure
    scale_format: UE8M0 uint8 per 32 FP8 values
    formula: dispatch_floor_ms + max(arithmetic_ops / 5.0332e12, semantic_io_bytes / 8.0e9)
