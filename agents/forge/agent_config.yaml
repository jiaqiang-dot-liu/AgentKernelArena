# One Forge integration for all v2 tasks. These are agent search controls.
workflow: auto
model: claude-opus-5
agent_backend: claude
permission_mode: acceptEdits
# Shared wall-clock cap: setup, checks, PORT and nested OPTIMIZE together.
timeout_seconds: 87300
session_timeout_seconds: 3600
max_port_attempts: 3
# HIP/Triton initialization uses Forge's own correctness-only implementer.
# Reserve the remaining campaign budget for the ordinary optimization loop.
initialization_max_attempts: 3
# Applies to HIP/Triton initialization and the native FlyDSL PORT phase.
initialization_budget_fraction: 0.4
# Empty follows agent_backend; no accidental provider/model mismatch.
supervisor_backend: ""
# Search controls passed to the engine's forge-loop (a rewrite passes them to
# its nested forge-loop). null leaves the engine default.
lanes: null
search_strategy: null
relay_mode: null
# inherit: the engine reads whatever knowledge store this process is set up for.
# local: every campaign starts from an empty local knowledge store of its own,
# so no campaign warm-starts from, or publishes into, another one's records.
knowledge_store: inherit
# LiteLLM cost attribution of every request the campaign's engine sends:
# {user: <end user>, session: <unique run name>, tags: [<extra tag>, ...]}.
# null sends no attribution headers.
litellm: null
# Optional executable for an environment with Hyperloom[forge] installed.
# python: /opt/forge/bin/python
